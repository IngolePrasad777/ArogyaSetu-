services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arogyasetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arogyasetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RDS_ENDPOINT: postgres
      RDS_PORT: 5432
      RDS_DATABASE: arogyasetu
      RDS_USERNAME: postgres
      RDS_PASSWORD: postgres
      JWT_SECRET: replace-with-at-least-64-random-characters-for-local-compose
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  pgdata:
