server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: arogyasetu-plus
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT:localhost}:${RDS_PORT:5432}/${RDS_DATABASE:postgres}?sslmode=${DB_SSL_MODE:disable}&sslfactory=org.postgresql.ssl.NonValidatingFactory
    username: ${RDS_USERNAME:postgres}
    password: ${RDS_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_EMAIL:}
    password: ${SMTP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-64-byte-base64-or-plain-secret-in-production}
    expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  otp:
    enabled: ${OTP_ENABLED:false}
    expiration-ms: ${OTP_EXPIRATION:300000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  aws:
    region: ${AWS_REGION:us-east-1}
    s3-bucket: ${AWS_BUCKET_NAME:arogyasetu-bucket}
  agora:
    app-id: ${AGORA_APP_ID:}
    app-certificate: ${AGORA_APP_CERTIFICATE:}

logging:
  level:
    org.springframework.security: INFO
